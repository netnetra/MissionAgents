<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MissionAgents</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar panel">
        <h2>Agents</h2>
        <div class="agent-list" id="agentList">
          <div class="agent-item comedian-item">
            <div class="agent-row">
              <span class="agent-name">Comedian</span>
              <label class="switch">
                <input type="checkbox" data-agent="comedian" checked />
                <span class="slider"></span>
              </label>
            </div>
          </div>
          <div class="agent-item cook-item">
            <div class="agent-row">
              <span class="agent-name">Cook</span>
              <label class="switch">
                <input type="checkbox" data-agent="cook" checked />
                <span class="slider"></span>
              </label>
            </div>
          </div>
          <div class="agent-item doctor-item">
            <div class="agent-row">
              <span class="agent-name">Doctor</span>
              <label class="switch">
                <input type="checkbox" data-agent="doctor" checked />
                <span class="slider"></span>
              </label>
            </div>
          </div>
        </div>
      </aside>

      <main class="center-stage panel">
        <h2>Agent Chat</h2>

        <div id="chatDisplay" class="chat-display"></div>

        <div class="prompt-box">
          <label for="userPrompt">Ask the agents</label>
          <textarea id="userPrompt" rows="8" placeholder="Ask for a recipe, a joke, or medical advice..."></textarea>
          <button id="sendBtn">Send to Agent</button>
        </div>
      </main>

      <section class="response-panel panel">
        <h2>Routing Story</h2>
        <div id="responseLog" class="response-log"></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
